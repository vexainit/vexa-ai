name: Vexa Bridge CI & Cloud Run Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies & run Pytest + Zero-Leak PII Gate
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest -v
          python -m app.services.seed_demo
          python scripts/verify_pii.py storage/masked/case_surat_wh_01_masked.csv

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck & Build Editorial Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
